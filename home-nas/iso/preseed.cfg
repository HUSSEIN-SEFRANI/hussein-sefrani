#### HomeNAS — Debian automatic installation answers ####
# Loaded automatically from the root of the installer initrd.
# The only question that is still asked is the final confirmation before
# the disk is erased (and the Wi-Fi network if there is no Ethernet cable).

### Language and keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i localechooser/supported-locales multiselect en_US.UTF-8, ar_SA.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network (DHCP)
d-i netcfg/choose_interface select auto
d-i netcfg/link_wait_timeout string 20
d-i netcfg/dhcp_timeout string 60
d-i netcfg/get_hostname string homenas
d-i netcfg/get_domain string local
d-i netcfg/hostname string homenas
d-i hw-detect/load_firmware boolean true

### Package mirror
d-i mirror/country string manual
d-i mirror/protocol string http
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Maintenance account (console only — the web panel has its own accounts)
# Password "homenas" must be changed at the first console login.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string HomeNAS maintenance
d-i passwd/username string nasadmin
d-i passwd/user-password password homenas
d-i passwd/user-password-again password homenas
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

### Clock (the time zone is set later from the web panel)
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

### Disk: whole disk, one partition + swap.
# The disk is chosen by /homenas/pick-disk.sh (skips the USB installer stick).
# Booting with homenas_raid=1 makes it a RAID 1 mirror over two disks.
d-i partman/early_command string sh /homenas/pick-disk.sh
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-md/confirm boolean true
d-i partman-md/confirm_nooverwrite boolean true
d-i mdadm/boot_degraded boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman/choose_partition select finish
d-i partman/mount_style select uuid
# NOTE: partman/confirm is intentionally NOT answered, so the installer stops
# once and shows which disk will be erased before writing anything.

### Packages
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
tasksel tasksel/first multiselect standard
d-i pkgsel/include string python3 python3-venv python3-pip ffmpeg avahi-daemon libnss-mdns sudo ca-certificates unattended-upgrades rsync parted e2fsprogs sqlite3 mdadm smartmontools
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/force-efi-extra-removable boolean true

### Install HomeNAS, then reboot
d-i preseed/late_command string sh /homenas/late.sh
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
