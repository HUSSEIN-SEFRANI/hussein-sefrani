<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سباق كريم</title>
<style>
  @font-face { font-family: "Baloo"; src: url(/static/fonts/baloo-ar.woff2) format("woff2"); font-weight: 400 800; }
  @font-face { font-family: "Baloo"; src: url(/static/fonts/baloo-lat.woff2) format("woff2"); font-weight: 400 800; unicode-range: U+0000-00FF; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7dd3fc; font-family: "Baloo", "Noto Sans Arabic", Tahoma, sans-serif; user-select: none; cursor: none; }
  canvas { display: block; }
  .ui { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.35); }
  .hud { display: none; }
  .hud.on { display: block; }
  .pill { position: absolute; background: rgba(15,23,42,.55); border-radius: 26px; padding: 6px 22px; font-weight: 800; font-size: 4vh; }
  .lap { top: 2.5vh; right: 3vh; }
  .stars { top: 2.5vh; left: 3vh; color: #fde047; }
  .pos { top: 2vh; left: 50%; transform: translateX(-50%); font-size: 6vh; padding: 4px 32px; }
  .turbo { bottom: 3vh; left: 50%; transform: translateX(-50%); font-size: 3vh; opacity: 0; transition: opacity .2s; background: linear-gradient(90deg,#f43f5e,#f97316,#facc15); }
  .turbo.on { opacity: 1; }
  .big { position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%); font-size: 22vh; font-weight: 800; color: #fde047; display: none; }
  .big.show { display: block; animation: pop .9s ease-out; }
  @keyframes pop { from { transform: translate(-50%,-50%) scale(2.2); opacity: 0 } 30% { opacity: 1 } to { transform: translate(-50%,-50%) scale(1); } }
  .menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 5vh; }
  .menu h1 { position: absolute; top: 3vh; margin: 0; font-size: 11vh; color: #fff; -webkit-text-stroke: 3px #1e3a8a; }
  .row { display: flex; gap: 2.4vh; margin-top: 2vh; }
  .card { width: 19vh; height: 19vh; border-radius: 4vh; background: rgba(255,255,255,.88); color: #1e3a8a; text-shadow: none; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 3.4vh; font-weight: 800; transition: transform .2s, box-shadow .2s; }
  .card .ic { font-size: 8vh; line-height: 1.1; }
  .card .pic { width: 16vh; height: 12vh; border-radius: 2.4vh; margin-bottom: .6vh; display: block; }
  .card.sel { transform: translateY(-1.5vh) scale(1.1); box-shadow: 0 0 0 1vh #fde047, 0 2vh 4vh rgba(0,0,0,.3); }
  .row.dim .card.sel, .row.dim .dot.sel { box-shadow: 0 0 0 .6vh rgba(255,255,255,.9); }
  .dot { width: 8vh; height: 8vh; border-radius: 50%; border: .6vh solid #fff; transition: transform .2s, box-shadow .2s; }
  .dot.sel { transform: scale(1.25); box-shadow: 0 0 0 1vh #fde047; }
  .help { margin-top: 2.6vh; font-size: 3vh; background: rgba(15,23,42,.55); border-radius: 3vh; padding: 1vh 3vh; }
  .help b { color: #fde047; }
  .speedo { position: absolute; left: 3vh; bottom: 3vh; width: 24vh; height: 24vh; border-radius: 50%; background: radial-gradient(circle, #1e293b 0 58%, #0f172a 70%); box-shadow: 0 0 0 .6vh #cbd5e1, 0 0 0 1.1vh #334155, 0 1vh 3vh rgba(0,0,0,.45); text-shadow: none; }
  .speedo svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .needle { position: absolute; left: calc(50% - .45vh); bottom: 50%; width: .9vh; height: 9.5vh; background: linear-gradient(#ff3b3b, #b91c1c); border-radius: .5vh .5vh 0 0; transform-origin: 50% 100%; transform: rotate(-120deg); transition: transform .12s linear; }
  .hubc { position: absolute; left: calc(50% - 1.5vh); top: calc(50% - 1.5vh); width: 3vh; height: 3vh; border-radius: 50%; background: #e2e8f0; border: .5vh solid #ef4444; box-sizing: border-box; }
  .kmh { position: absolute; left: 50%; bottom: 13%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .kmh b { font-size: 3.6vh; background: #e2e8f0; color: #0f172a; border-radius: .8vh; padding: .2vh 1vh; font-family: monospace, sans-serif; letter-spacing: .2vh; }
  .kmh small { font-size: 1.7vh; color: #94a3b8; margin-top: .4vh; }
  .end { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(30,58,138,.45); }
  .end.on { display: flex; }
  .end .cup { font-size: 22vh; line-height: 1; animation: bounce 1s ease-in-out infinite; }
  @keyframes bounce { 50% { transform: translateY(-3vh) } }
  .end .t1 { font-size: 10vh; font-weight: 800; color: #fde047; }
  .end .t2 { font-size: 5vh; font-weight: 800; }
  .conf { position: absolute; top: -5vh; width: 1.6vh; height: 2.6vh; border-radius: .4vh; animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg) } }
</style>
</head>
<body>
<div class="ui">
  <div class="menu" id="menu">
    <h1>سباق كريم</h1>
    <div class="row" id="vehicles"></div>
    <div class="row dim" id="colors"></div>
    <div class="help"><b>← →</b> اختر &nbsp; <b>↑ ↓</b> السيارة أو اللون &nbsp; <b>موافق</b> انطلق!</div>
  </div>
  <div class="hud" id="hud">
    <div class="pill lap" id="lap"></div>
    <div class="pill stars" id="stars"></div>
    <div class="pill pos" id="pos"></div>
    <div class="pill turbo" id="turbo">🔥 توربو!</div>
    <div class="speedo" dir="ltr"><svg viewBox="-100 -100 200 200" id="dial"></svg><div class="needle" id="needle"></div><div class="hubc"></div><div class="kmh"><b id="kmh">000</b><small>كم/س</small></div></div>
    <div class="help" style="position:absolute;bottom:3vh;right:3vh;font-size:2.4vh"><b>← →</b> توجيه &nbsp; <b>↑</b> توربو &nbsp; <b>موافق</b> بيب بيب!</div>
  </div>
  <div class="big" id="big"></div>
  <div class="end" id="end"><div class="cup" id="cup">🏆</div><div class="t1" id="t1"></div><div class="t2" id="t2"></div>
    <div class="help">اضغط <b>موافق</b> لتلعب مرة أخرى</div></div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
