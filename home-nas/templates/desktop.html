<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{ server_name }}">
  <meta name="theme-color" content="#581c87">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icon.png') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/icon.svg') }}">
  <script src="{{ url_for('static', filename='js/i18n-dict.js') }}"></script>
  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/desktop.css') }}">
  <title>{{ server_name }}</title>
</head>
<body>
  <div id="desktop"><div id="desk-vine"></div><div id="icons"></div></div>
  <header id="taskbar">
    <button class="tb-btn tb-logo" id="tb-start" title="القائمة"><img class="logo-img" src="{{ url_for('static', filename='img/icon.svg') }}" alt=""><span class="name">{{ server_name }}</span></button>
    <div id="tb-windows"></div>
    <span id="tb-clock"></span>
  </header>
  <script>window.__ME__ = {{ me|tojson }};</script>
  <script type="module" src="{{ url_for('static', filename='js/desktop.js') }}"></script>
</body>
</html>
