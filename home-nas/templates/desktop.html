<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{ server_name }}">
  <meta name="theme-color" content="#102542">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icon.png') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/icon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/desktop.css') }}">
  <title>{{ server_name }}</title>
</head>
<body>
  <div id="desktop"><div id="icons"></div></div>
  <header id="taskbar">
    <button class="tb-btn tb-logo" id="tb-start" title="القائمة"><span class="dot"><svg class="i" viewBox="0 0 24 24" style="stroke:#fff"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg></span><span class="name">{{ server_name }}</span></button>
    <div id="tb-windows"></div>
    <span id="tb-clock"></span>
  </header>
  <script>window.__ME__ = {{ me|tojson }};</script>
  <script type="module" src="{{ url_for('static', filename='js/desktop.js') }}"></script>
</body>
</html>
