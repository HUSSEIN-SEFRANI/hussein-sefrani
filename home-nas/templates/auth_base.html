<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{{ server_name }}">
  <meta name="theme-color" content="#581c87">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icon.png') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/icon.svg') }}">
  <script src="{{ url_for('static', filename='js/i18n-dict.js') }}"></script>
  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/desktop.css') }}">
  <title>{{ server_name }}</title>
  <style>
    body { overflow: auto; background: var(--wall); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .auth { width: 380px; max-width: 100%; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 30px 28px; }
    .auth .logo { width: 270px; max-width: 90%; height: auto; margin: 0 auto 4px; display: block; }
    .auth .tag { text-align: center; color: #15803d; font-weight: 700; margin: 0 0 14px; }
    .auth h1 { text-align: center; font-size: 22px; margin: 0; }
    .auth .sub { text-align: center; color: var(--muted); margin: 4px 0 20px; }
    .auth .btn.primary { width: 100%; height: 44px; margin-top: 18px; font-size: 15px; }
    .auth .err { background: color-mix(in srgb, var(--err) 12%, transparent); color: var(--err); padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; }
    .auth input.field { height: 44px; font-size: 16px; }
    .auth .okbox { background: color-mix(in srgb, #16a34a 14%, transparent); color: #15803d; padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; font-weight: 700; }
    .act-box { border: 1px dashed var(--border); border-radius: 14px; padding: 12px 14px; margin: 10px 0 6px; }
    .act-dev { font: 700 24px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 1px; text-align: center; color: var(--accent); direction: ltr; margin: 2px 0 8px; user-select: all; }
    .act-code { width: 100%; min-height: 84px; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; direction: ltr; word-break: break-all; resize: vertical; padding: 8px 10px; }
    .act-wa { display: flex; gap: 12px; align-items: center; margin: 4px 0 10px; font-size: 13px; }
    .act-wa .qr { width: 92px; height: 92px; background: #fff; border-radius: 8px; padding: 4px; flex: none; display: block; }
    @media (max-width: 520px) { .act-wa .qr { display: none; } }
    .act-state { text-align: center; margin: 0 0 12px; }
  </style>
</head>
<body>
  <main class="auth">
    <img class="logo" src="{{ url_for('static', filename='img/logo.svg') }}" alt="HOME ANAB">
    <p class="tag">منزل العنب</p>
    {% block content %}{% endblock %}
    <div id="langs"></div>
    <script>document.getElementById('langs').appendChild(I18N.switcher());</script>
  </main>
</body>
</html>
