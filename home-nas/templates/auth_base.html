<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{{ server_name }}">
  <meta name="theme-color" content="#102542">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icon.png') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/icon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/desktop.css') }}">
  <title>{{ server_name }}</title>
  <style>
    body { overflow: auto; background: var(--wall); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .auth { width: 380px; max-width: 100%; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 30px 28px; }
    .auth .logo { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #4c8dff, #19b3a3); box-shadow: 0 8px 20px rgba(47,111,237,.35); }
    .auth .logo svg { width: 34px; height: 34px; stroke: #fff; }
    .auth h1 { text-align: center; font-size: 22px; margin: 0; }
    .auth .sub { text-align: center; color: var(--muted); margin: 4px 0 20px; }
    .auth .btn.primary { width: 100%; height: 44px; margin-top: 18px; font-size: 15px; }
    .auth .err { background: color-mix(in srgb, var(--err) 12%, transparent); color: var(--err); padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; }
    .auth input.field { height: 44px; font-size: 16px; }
  </style>
</head>
<body>
  <main class="auth">
    <div class="logo"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg></div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
