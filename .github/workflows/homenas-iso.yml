name: Build H.SEF ISO

on:
  push:
    paths:
      - 'home-nas/**'
      - '.github/workflows/homenas-iso.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the ISO as a GitHub release'
        type: boolean
        default: true
      replace:
        description: 'Replace the files of an existing release with the same version'
        type: boolean
        default: false
      cleanup_old:
        description: 'Delete old releases from before versioning (tags homenas-*)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y xorriso cpio

      - name: Check the app imports
        run: |
          pip install -q -r home-nas/requirements.txt
          cd home-nas && python -c "from homenas import create_app"

      - name: Build ISO from the latest Debian netinst
        run: ./home-nas/iso/build-iso.sh

      - name: Name the release
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISO=$(ls home-nas/HSEF-*.iso)
          VERSION=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('home-nas/homenas/__init__.py').read()).group(1))")
          echo "iso=$ISO" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh home-nas/HSEF-*
          # release notes = this version's section of CHANGELOG.md, then the install steps
          python3 - "$VERSION" > release-notes.md <<'PY'
          import re, sys
          v = sys.argv[1]
          text = open("home-nas/CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## v" + re.escape(v) + r"\s*\n(.*?)(?=^## v|\Z)", text, re.S | re.M)
          if not m:
              sys.exit(f"CHANGELOG.md has no section for v{v}")
          print(m.group(1).strip())
          print(open("home-nas/iso/release-install.md", encoding="utf-8").read())
          PY
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && gh release view "v$VERSION" >/dev/null 2>&1; then
            if [ "${{ inputs.replace }}" = "true" ]; then
              echo "Replacing the files of release v$VERSION"
              for a in $(gh release view "v$VERSION" --json assets -q '.assets[].name'); do gh release delete-asset "v$VERSION" "$a" --yes; done
            else
              echo "::error::Release v$VERSION already exists. Raise __version__ in home-nas/homenas/__init__.py and add a CHANGELOG section."
              exit 1
            fi
          fi

      - name: Package the app for in-place updates
        run: |
          V=${{ steps.meta.outputs.version }}
          tar -C home-nas --exclude=./iso/build --exclude=./data --exclude=./.venv --exclude='__pycache__' \
              --exclude='*.iso' --exclude='*.iso.sha256' -czf "$RUNNER_TEMP/hsef-app-$V.tar.gz" .
          mv "$RUNNER_TEMP/hsef-app-$V.tar.gz" home-nas/
          sha256sum "home-nas/hsef-app-$V.tar.gz" | sed 's#home-nas/##' > "home-nas/hsef-app-$V.tar.gz.sha256"
          ls -lh home-nas/hsef-app-*

      - name: Keep the ISO as a build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: homenas-iso
          path: home-nas/HSEF-*
          retention-days: 7

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "H.SEF"
          body: ""
          make_latest: true
          files: |
            ${{ steps.meta.outputs.iso }}
            ${{ steps.meta.outputs.iso }}.sha256
            home-nas/hsef-app-${{ steps.meta.outputs.version }}.tar.gz
            home-nas/hsef-app-${{ steps.meta.outputs.version }}.tar.gz.sha256

      - name: Hide release details (name H.SEF only, no notes)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            gh release edit "$t" --title "H.SEF" --notes "" || true
          done

      - name: Delete old releases from before versioning
        if: github.event_name == 'workflow_dispatch' && inputs.cleanup_old
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^homenas-' || true); do
            echo "Deleting old release $t"
            gh release delete "$t" --yes --cleanup-tag
          done
