name: Build HOME ANAB ISO

on:
  push:
    paths:
      - 'home-nas/**'
      - '.github/workflows/homenas-iso.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the ISO as a GitHub release'
        type: boolean
        default: true
      replace:
        description: 'Replace the files of an existing release with the same version'
        type: boolean
        default: false
      cleanup_old:
        description: 'Delete old releases from before versioning (tags homenas-*)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y xorriso cpio debootstrap squashfs-tools dosfstools mtools

      - name: Check the app imports
        run: |
          pip install -q -r home-nas/requirements.txt
          cd home-nas && python -c "from homenas import create_app"

      - name: Build the offline installer ISO (live system + HOME ANAB installer)
        run: sudo WORK=/mnt/hsef-build ./home-nas/installer/build-installer-iso.sh && sudo chown -R "$USER" home-nas/HOME-ANAB-*

      - name: Name the release
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISO=$(ls home-nas/HOME-ANAB-*.iso)
          VERSION=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('home-nas/homenas/__init__.py').read()).group(1))")
          echo "iso=$ISO" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh home-nas/HOME-ANAB-*
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && gh release view "v$VERSION" >/dev/null 2>&1; then
            if [ "${{ inputs.replace }}" = "true" ]; then
              echo "Replacing the files of release v$VERSION"
              for a in $(gh release view "v$VERSION" --json assets -q '.assets[].name'); do gh release delete-asset "v$VERSION" "$a" --yes; done
            else
              echo "::error::Release v$VERSION already exists. Raise __version__ in home-nas/homenas/__init__.py."
              exit 1
            fi
          fi

      - name: Package the app for in-place updates
        run: |
          V=${{ steps.meta.outputs.version }}
          tar -C home-nas --exclude=./iso/build --exclude=./data --exclude=./.venv --exclude='__pycache__' --exclude=./games \
              --exclude='*.iso' --exclude='*.iso.sha256' -czf "$RUNNER_TEMP/hsef-app-$V.tar.gz" .
          mv "$RUNNER_TEMP/hsef-app-$V.tar.gz" home-nas/
          sha256sum "home-nas/hsef-app-$V.tar.gz" | sed 's#home-nas/##' > "home-nas/hsef-app-$V.tar.gz.sha256"
          ls -lh home-nas/hsef-app-*

      - name: Keep the ISO as a build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: homenas-iso
          path: home-nas/HOME-ANAB-*
          retention-days: 7

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "HOME ANAB ${{ steps.meta.outputs.tag }}"
          body: |
            سيرفر منزلي بدون إنترنت

            Hussein Sefrani
          make_latest: true
          files: |
            ${{ steps.meta.outputs.iso }}

      - name: Publish the update package (branch "updates", read by the devices)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.meta.outputs.version }}
          F="hsef-app-$V.tar.gz"
          D="$RUNNER_TEMP/updates"
          mkdir -p "$D" && cp "home-nas/$F" "$D/"
          SUM=$(sha256sum "$D/$F" | cut -d' ' -f1)
          printf '{"version": "%s", "file": "%s", "sha256": "%s"}\n' "$V" "$F" "$SUM" > "$D/latest.json"
          cd "$D"
          git init -q -b updates
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "HOME ANAB v$V"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" updates
          cat latest.json

      - name: Keep release pages minimal (version name, one line, author)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(printf 'سيرفر منزلي بدون إنترنت\n\nHussein Sefrani')
          for t in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            gh release edit "$t" --title "HOME ANAB $t" --notes "$NOTES" || true
            # صفحة الإصدار تعرض ملف الإيزو فقط
            for a in $(gh release view "$t" --json assets -q '.assets[].name' | grep -v '\.iso$' || true); do
              gh release delete-asset "$t" "$a" --yes || true
            done
          done

      - name: Delete old releases from before versioning
        if: github.event_name == 'workflow_dispatch' && inputs.cleanup_old
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^homenas-' || true); do
            echo "Deleting old release $t"
            gh release delete "$t" --yes --cleanup-tag
          done
