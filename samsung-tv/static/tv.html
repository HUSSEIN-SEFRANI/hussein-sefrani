<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مواقيت البيت">
<link rel="apple-touch-icon" href="tree-icon.png">
<title>شاشة البيت</title>
<style>
:root{--gold:#e6c55a;--gold2:#b8892a;--text:#f6f1e1;--muted:#d9d2bb;--glass:rgba(5,15,12,.55);--line:rgba(230,197,90,.35)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#06140f;color:var(--text);
  font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic",Arial,sans-serif;cursor:none}
.bg{position:fixed;inset:0;background-size:cover;background-position:center;transition:opacity 3s ease;opacity:0}
.bg.show{opacity:1}
.shade{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 30%,rgba(0,0,0,.55) 100%),linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,transparent 55%,rgba(0,0,0,.65))}
.screen{position:fixed;inset:0;height:100vh;padding:2vw 2.6vw 1.8vw;display:grid;grid-template-columns:minmax(0,1fr) 40vw;gap:2vw}
.info{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:.9vw;min-height:0}
/* top */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:2vw}
.clock b{display:block;font-size:5.6vw;font-weight:300;line-height:.95;letter-spacing:.1vw;direction:ltr;font-variant-numeric:tabular-nums;text-shadow:0 .3vw 1.2vw rgba(0,0,0,.5)}
.clock b small{font-size:1.9vw;color:var(--gold);margin-inline-start:.6vw}
.clock .d{font-size:1.35vw;color:var(--muted);margin-top:.6vw}
.clock .h{font-size:1.35vw;color:var(--gold);margin-top:.2vw}
.weather{background:var(--glass);border:1px solid var(--line);border-radius:1.4vw;padding:.9vw 1.2vw;min-width:19vw;backdrop-filter:blur(8px)}
.w-now{display:flex;align-items:center;gap:1.2vw}
.w-now svg{width:3.8vw;height:3.8vw;flex:none}
.w-now .t{font-size:3vw;font-weight:300;direction:ltr}
.w-now .ds{font-size:1.15vw}
.w-now .ex{font-size:.85vw;color:var(--muted);margin-top:.2vw}
.w-days{display:grid;grid-template-columns:repeat(3,1fr);gap:.6vw;margin-top:1vw;border-top:1px solid var(--line);padding-top:.8vw;text-align:center}
.w-days div{font-size:.9vw;color:var(--muted)}
.w-days svg{width:1.7vw;height:1.7vw;display:block;margin:.3vw auto}
.w-days b{color:var(--text);direction:ltr;display:inline-block}
.w-city{font-size:1vw;color:var(--muted);margin-bottom:.4vw}
/* center */
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mosque{font-size:1.15vw;color:var(--muted);letter-spacing:.05vw;unicode-bidi:plaintext}
.next-label{font-size:1.7vw;color:var(--gold);margin-top:.6vw}
.next-name{font-size:3.9vw;font-weight:700;line-height:1.1;text-shadow:0 .3vw 1.5vw rgba(0,0,0,.6)}
.countdown{font-size:2.9vw;font-weight:300;direction:ltr;font-variant-numeric:tabular-nums;color:var(--text)}
.notice{margin-top:.8vw;font-size:1.15vw;padding:.5vw 1.4vw;border-radius:2vw;background:rgba(230,197,90,.16);border:1px solid var(--line);display:none}
.adhan .next-name{color:var(--gold);animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 2.5vw rgba(230,197,90,.8)}}
/* verse */
.verse{text-align:center;min-height:4.6vw;display:flex;flex-direction:column;justify-content:center;transition:opacity 1.2s}
.verse .v{font-size:1.85vw;font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic","Times New Roman",serif;line-height:1.5}
.verse .s{font-size:.95vw;color:var(--gold);margin-top:.2vw}
.verse.fade{opacity:0}
/* prayers */
.prayers{display:grid;grid-template-columns:repeat(6,1fr);gap:.7vw}
.p{background:var(--glass);border:1px solid var(--line);border-radius:1.2vw;padding:.7vw .6vw;text-align:center;backdrop-filter:blur(6px)}
.p .n{font-size:1.25vw;color:var(--muted)}
.p .t{font-size:2.15vw;font-weight:600;direction:ltr;font-variant-numeric:tabular-nums;line-height:1.2}
.p .i{font-size:.8vw;color:var(--muted);min-height:1.4vw}
.p.past{opacity:.55}
.p.now{background:linear-gradient(160deg,rgba(230,197,90,.35),rgba(184,137,42,.18));border-color:var(--gold)}
.p.now .n,.p.now .i{color:var(--text)}
.p.next{border-color:var(--gold);box-shadow:0 0 0 .15vw rgba(230,197,90,.5) inset}

/* ---------- prayer tree ---------- */
.treebox{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;background:var(--glass);border:1px solid var(--line);
  border-radius:1.6vw;padding:1vw 1.2vw;backdrop-filter:blur(8px);min-height:0;overflow:hidden}
.tb-h{display:flex;justify-content:space-between;align-items:baseline;font-size:1.45vw;color:var(--gold);font-weight:700}
.tb-h small{font-size:.95vw;color:var(--muted);font-weight:400}
.treebox svg{width:100%;height:100%;min-height:0;display:block}
.tb-stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:.5vw}
.tb-stats b{display:block;font-size:1.8vw;line-height:1.1}
.tb-stats span{font-size:.85vw;color:var(--muted)}
.tb-stats .g b{color:#5fd17a}.tb-stats .y b{color:#f0c24a}.tb-stats .f b{color:#c08a55}
.ask{margin-top:.8vw;display:none;background:rgba(4,14,10,.94);border:1px solid var(--gold);
  border-radius:1.2vw;padding:1vw 1.2vw;box-shadow:0 1vw 3vw rgba(0,0,0,.6)}
.ask.show{display:block}
.ask h3{margin:0;font-size:1.6vw}
.ask p{margin:.2vw 0 .8vw;font-size:.95vw;color:var(--muted)}
.ask .opts{display:grid;grid-template-columns:repeat(2,1fr);gap:.6vw}
.ask button{display:flex;align-items:center;gap:.7vw;font:inherit;font-size:1.05vw;color:var(--text);background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.15);border-radius:.8vw;padding:.55vw .9vw;text-align:right;cursor:pointer}
.ask button i{width:1.4vw;height:1.4vw;flex:none;border-radius:50% 0}
.ask button.sel,.ask button:focus-visible{outline:.25vw solid var(--gold);outline-offset:.1vw;background:rgba(230,197,90,.15)}
.leaf{cursor:pointer}
@keyframes leaf-fall{0%{transform:translate(0,0) rotate(0)}35%{transform:translate(calc(var(--dx)*.3 + 30px),calc(var(--dy)*.35)) rotate(calc(var(--rot)*.4))}
  70%{transform:translate(calc(var(--dx)*.7 - 25px),calc(var(--dy)*.7)) rotate(calc(var(--rot)*.8))}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}
.falling{animation:leaf-fall 2.2s ease-in forwards}
/* ---------- phone (portrait) ---------- */
@media (orientation: portrait){
  html,body{overflow:auto;height:auto;cursor:auto}
  .bg,.shade{position:fixed}
  .screen{position:relative;height:auto;display:block;padding:max(14px,env(safe-area-inset-top)) 14px 90px}
  .info{display:block}
  .top{flex-direction:column;align-items:stretch;gap:12px}
  .clock b{font-size:17vw}.clock b small{font-size:6vw}.clock .d,.clock .h{font-size:4vw}
  .weather{min-width:0;padding:12px 14px;border-radius:16px}
  .w-now svg{width:13vw;height:13vw}.w-now .t{font-size:10vw}.w-now .ds{font-size:4vw}.w-now .ex{font-size:3vw}
  .w-days div{font-size:3.2vw}.w-days svg{width:7vw;height:7vw}.w-city{font-size:3.2vw}
  .center{margin:22px 0 10px}.mosque{font-size:3.6vw}.next-label{font-size:5vw}.next-name{font-size:10vw}.countdown{font-size:8vw}.notice{font-size:3.6vw;border-radius:20px;padding:6px 14px}
  .verse{margin:8px 0 14px}.verse .v{font-size:5.6vw}.verse .s{font-size:3.2vw}
  .prayers{grid-template-columns:repeat(3,1fr);gap:8px}.p{border-radius:14px;padding:8px 4px}.p .n{font-size:3.8vw}.p .t{font-size:6.8vw}.p .i{font-size:2.8vw;min-height:0}
  .treebox{display:block;margin-top:16px;border-radius:18px;padding:12px}
  .tb-h{font-size:4.6vw}.tb-h small{font-size:3.2vw}
  .treebox svg{height:auto;aspect-ratio:1/1}
  .tb-stats b{font-size:6.5vw}.tb-stats span{font-size:3vw}
  .ask{position:static;margin-top:12px;border-radius:16px;padding:14px}
  .ask h3{font-size:6vw}.ask p{font-size:3.4vw;margin:4px 0 12px}
  .ask .opts{grid-template-columns:1fr;gap:8px}.ask button{font-size:4.4vw;padding:13px;border-radius:12px;gap:10px}.ask button i{width:6vw;height:6vw}
  .unlock{font-size:3.8vw;padding:10px 18px;border-radius:30px;top:auto;bottom:max(16px,env(safe-area-inset-bottom));width:max-content;max-width:92vw}
  .warn{position:static;transform:none;white-space:normal;text-align:center;font-size:2.8vw;margin-top:12px}
  .overlay .ab-l{font-size:7vw}.overlay .ab-n{font-size:16vw}.overlay .ab-h{font-size:3.6vw}
}
.overlay{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(ellipse at 50% 45%,#0b3d2e,#020806);z-index:5}
.overlay.show{display:flex}
.overlay .ab-l{font-size:3vw;color:var(--gold)}
.overlay .ab-n{font-size:11vw;font-weight:700;line-height:1.15;animation:glow 2.5s ease-in-out infinite}
.overlay .ab-h{font-size:1.4vw;color:var(--muted);margin-top:2vw}
.unlock{pointer-events:none;position:fixed;top:.4vw;left:50%;transform:translateX(-50%);z-index:4;white-space:nowrap;font-size:1.05vw;padding:.45vw 1.4vw;border-radius:3vw;
  background:rgba(230,197,90,.92);color:#1b1404;font-weight:700;box-shadow:0 .4vw 1.6vw rgba(0,0,0,.5)}
.warn{position:fixed;top:.5vw;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:.9vw;color:var(--muted);opacity:.8}
@media (orientation: portrait){.unlock{top:auto;white-space:normal;font-size:3.8vw;padding:10px 18px;border-radius:30px;bottom:max(16px,env(safe-area-inset-bottom));width:max-content;max-width:92vw;text-align:center}}
</style>
</head>
<body>
<div class="bg" id="bgA"></div><div class="bg" id="bgB"></div><div class="shade"></div>
<div class="screen">
 <div class="info">
  <div class="top">
    <div class="clock"><b id="time">--:--</b><div class="d" id="greg"></div><div class="h" id="hijri"></div></div>
    <div class="weather" id="weather"><div class="w-city">موسكرون</div><div class="w-now">جارٍ تحميل الطقس…</div></div>
  </div>
  <div class="center" id="center">
    <div class="mosque" id="mosque">مواقيت الصلاة — موسكرون</div>
    <div class="next-label" id="nextLabel">الصلاة القادمة</div>
    <div class="next-name" id="nextName">—</div>
    <div class="countdown" id="countdown">--:--:--</div>
    <div class="notice" id="notice"></div>
  </div>
  <div class="verse" id="verse"><div class="v"></div><div class="s"></div></div>
  <div class="prayers" id="prayers"></div>
 </div>
 <div class="treebox" id="treebox">
  <div class="tb-h"><span>🌳 شجرة الصلاة</span><small id="tbMonth"></small></div>
  <svg id="tree" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="شجرة الصلاة"></svg>
  <div class="tb-stats">
    <div class="g"><b id="sG">0</b><span>في وقتها</span></div>
    <div class="y"><b id="sY">0</b><span>متأخرة</span></div>
    <div class="f"><b id="sF">0</b><span>سقطت</span></div>
    <div><b id="sP">—</b><span>الإنجاز</span></div>
  </div>
  <div class="ask" id="ask">
    <h3 id="askTitle"></h3><p id="askSub"></p>
    <div class="opts">
      <button data-v="g"><i style="background:linear-gradient(135deg,#5fd17a,#2e8b47)"></i>صليتها في وقتها</button>
      <button data-v="y"><i style="background:linear-gradient(135deg,#f5d26b,#d39a1e)"></i>صليتها متأخراً</button>
      <button data-v="f"><i style="border:.15vw dashed #c08a55"></i>لم أصلّها</button>
      <button data-v="later"><i style="background:rgba(255,255,255,.18);border-radius:50%"></i>اسألني لاحقاً</button>
    </div>
  </div>
 </div>
</div>
<div class="warn" id="warn"></div>
<div class="overlay" id="adhanBox"><div class="ab-l">حان الآن موعد أذان</div><div class="ab-n" id="abName"></div>
  <div class="ab-h">اضغط أي زر في الريموت لإيقاف الصوت</div></div>
<div class="unlock" id="unlock">🔊 اضغط OK في الريموت (أو المس الشاشة) مرة واحدة لتفعيل صوت الأذان</div>

<script>
const $ = s => document.querySelector(s);
const PN = { fajr:'الفجر', shuruq:'الشروق', dhuhr:'الظهر', asr:'العصر', maghrib:'المغرب', isha:'العشاء' };
const FIVE = ['fajr','dhuhr','asr','maghrib','isha'];
const VERSES = [
  ['ألا بذكر الله تطمئن القلوب', 'سورة الرعد · 28'],
  ['فإن مع العسر يسرا', 'سورة الشرح · 5'],
  ['وقل رب زدني علما', 'سورة طه · 114'],
  ['فاذكروني أذكركم واشكروا لي ولا تكفرون', 'سورة البقرة · 152'],
  ['إن الله مع الصابرين', 'سورة البقرة · 153'],
  ['وما توفيقي إلا بالله', 'سورة هود · 88'],
  ['ادعوني أستجب لكم', 'سورة غافر · 60'],
  ['ومن يتوكل على الله فهو حسبه', 'سورة الطلاق · 3'],
  ['سبحان الله وبحمده، سبحان الله العظيم', 'ذكر'],
  ['لا حول ولا قوة إلا بالله', 'ذكر'],
  ['أستغفر الله العظيم وأتوب إليه', 'ذكر'],
  ['اللهم صل وسلم على نبينا محمد', 'ذكر'],
];

// ---------- original geometric wallpapers (generated SVG) ----------
const PALETTES = [
  { bg1:'#0b3d2e', bg2:'#04140f', line:'#e6c55a' },   // emerald & gold
  { bg1:'#13234a', bg2:'#050a1a', line:'#e6c55a' },   // midnight & gold
  { bg1:'#0f4a4a', bg2:'#041818', line:'#f1e3b5' },   // teal & cream
  { bg1:'#4a1420', bg2:'#16050a', line:'#e6c55a' },   // maroon & gold
];
function svgURI(svg){ return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")'; }
const PATTERNS = [
  // eight-pointed stars
  c => `<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><g fill='none' stroke='${c.line}' stroke-opacity='.22' stroke-width='1.4'><rect x='30' y='30' width='60' height='60'/><rect x='30' y='30' width='60' height='60' transform='rotate(45 60 60)'/><circle cx='60' cy='60' r='14'/><path d='M0 0L30 30M120 0L90 30M0 120L30 90M120 120L90 90'/></g></svg>`,
  // six-pointed lattice
  c => `<svg xmlns='http://www.w3.org/2000/svg' width='104' height='180' viewBox='0 0 104 180'><g fill='none' stroke='${c.line}' stroke-opacity='.2' stroke-width='1.3'><path d='M52 0l26 45-26 45-26-45zM52 90l26 45-26 45-26-45zM0 45l26 45L0 135M104 45L78 90l26 45'/><path d='M26 45h52M26 135h52M0 90h26M78 90h26'/></g></svg>`,
  // interlaced circles
  c => `<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><g fill='none' stroke='${c.line}' stroke-opacity='.18' stroke-width='1.2'><circle cx='50' cy='50' r='25'/><circle cx='0' cy='50' r='25'/><circle cx='100' cy='50' r='25'/><circle cx='50' cy='0' r='25'/><circle cx='50' cy='100' r='25'/><circle cx='25' cy='25' r='25'/><circle cx='75' cy='25' r='25'/><circle cx='25' cy='75' r='25'/><circle cx='75' cy='75' r='25'/></g></svg>`,
];
function patternBg(i){
  const c = PALETTES[i % PALETTES.length], pat = PATTERNS[Math.floor(i / PALETTES.length) % PATTERNS.length](c);
  return `${svgURI(pat)}, radial-gradient(ellipse at 50% 35%, ${c.bg1} 0%, ${c.bg2} 75%)`;
}
function nightBg(){
  // night sky with a crescent and a mihrab arch silhouette
  const stars = Array.from({ length: 70 }, () => `<circle cx='${Math.random()*1920|0}' cy='${Math.random()*700|0}' r='${(Math.random()*1.8+.4).toFixed(1)}' fill='#fff' opacity='${(Math.random()*.6+.2).toFixed(2)}'/>`).join('');
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1920 1080' preserveAspectRatio='xMidYMid slice'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#050b1f'/><stop offset='1' stop-color='#123a35'/></linearGradient></defs><rect width='1920' height='1080' fill='url(#g)'/>${stars}<g transform='translate(960 150)'><circle r='70' fill='#f3e3a3'/><circle cx='28' cy='-14' r='64' fill='#07112a'/></g><path d='M0 1080V860h300v-60c0-60 40-110 90-140 50 30 90 80 90 140v60h960v-60c0-60 40-110 90-140 50 30 90 80 90 140v60h300v220z' fill='#020806' opacity='.85'/><path d='M760 1080V760c0-120 90-210 200-260 110 50 200 140 200 260v320z' fill='#020806' opacity='.9'/></svg>`;
  return svgURI(svg);
}
let wallpapers = [], bgIndex = 0, bgFlip = false;
function nextBackground(){
  const items = [...wallpapers.map(f => ({ img: f })), ...Array.from({ length: PALETTES.length * PATTERNS.length }, (_, i) => ({ pat: i }))];
  let css, size = 'cover';
  if (isNight() && bgIndex % 3 === 0) css = nightBg();
  else {
    const it = items[bgIndex % items.length];
    if (it.img) css = `url("/wallpapers/${encodeURIComponent(it.img)}")`;
    else { css = patternBg(it.pat); size = 'auto, cover'; }
  }
  bgIndex++;
  const show = bgFlip ? $('#bgA') : $('#bgB'), hide = bgFlip ? $('#bgB') : $('#bgA');
  show.style.backgroundImage = css; show.style.backgroundSize = size;
  show.classList.add('show'); hide.classList.remove('show'); bgFlip = !bgFlip;
}

// ---------- data ----------
let pt = null;
async function getJSON(u){ const r = await fetch(u, { cache:'no-store' }); return r.json(); }
async function loadPrayer(){ try { pt = await getJSON('/api/prayer'); render(); } catch(e) { $('#warn').textContent = 'تعذّر تحميل المواقيت'; } }
async function loadWallpapers(){ try { wallpapers = (await getJSON('/api/wallpapers')).files || []; } catch(e) {} }
function at(hm, plusDay){ const [h, m] = hm.split(':').map(Number); const d = new Date(); d.setHours(h, m, 0, 0); if (plusDay) d.setDate(d.getDate() + 1); return d; }
function isNight(){
  if (!pt) { const h = new Date().getHours(); return h >= 20 || h < 6; }
  const now = new Date(); return now >= at(pt.times.isha) || now < at(pt.times.fajr);
}

const ICONS = {
  sun: "<svg viewBox='0 0 64 64'><circle cx='32' cy='32' r='12' fill='#f7c948'/><g stroke='#f7c948' stroke-width='4' stroke-linecap='round'><path d='M32 6v8M32 50v8M6 32h8M50 32h8M13.6 13.6l5.7 5.7M44.7 44.7l5.7 5.7M13.6 50.4l5.7-5.7M44.7 19.3l5.7-5.7'/></g></svg>",
  moon: "<svg viewBox='0 0 64 64'><path d='M40 8a24 24 0 1 0 16 38A20 20 0 0 1 40 8z' fill='#f3e3a3'/></svg>",
  partly: "<svg viewBox='0 0 64 64'><circle cx='24' cy='24' r='10' fill='#f7c948'/><path d='M20 50h28a10 10 0 0 0 0-20 14 14 0 0 0-26 4 8 8 0 0 0-2 16z' fill='#e8edf3'/></svg>",
  cloud: "<svg viewBox='0 0 64 64'><path d='M16 48h32a11 11 0 0 0 0-22 15 15 0 0 0-29 4 9 9 0 0 0-3 18z' fill='#d6dde6'/></svg>",
  fog: "<svg viewBox='0 0 64 64'><g stroke='#d6dde6' stroke-width='4' stroke-linecap='round'><path d='M10 24h44M6 34h52M12 44h40'/></g></svg>",
  rain: "<svg viewBox='0 0 64 64'><path d='M16 38h32a10 10 0 0 0 0-20 14 14 0 0 0-27 4 8 8 0 0 0-5 16z' fill='#d6dde6'/><g stroke='#6cb4ff' stroke-width='3.5' stroke-linecap='round'><path d='M22 46l-3 8M33 46l-3 8M44 46l-3 8'/></g></svg>",

let sounds = {}, audioOK = false, actx = null, player = null, toneTimer = null, adhanDone = '';
async function loadSounds(){ try { sounds = await getJSON('/api/sounds'); } catch(e) {} }
function unlockAudio(){
  if (audioOK) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch(e) {}
  try { const a = new Audio(); a.muted = true; a.play().catch(() => {}); } catch(e) {}
  audioOK = true; $('#unlock').style.display = 'none';
}
function stopAdhan(){
  if (player) { player.pause(); player = null; }
  clearInterval(toneTimer); toneTimer = null;
  $('#adhanBox').classList.remove('show');
}
function tone(){
  // gentle three-note chime, repeated a few times (used when no adhan file is present)
  if (!actx) return;
  let n = 0;
  const ring = () => {
    [523.25, 659.25, 783.99].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + i * 0.45;
      o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.35, t0 + 0.05); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.6);
      o.start(t0); o.stop(t0 + 1.7);
    });
    if (++n >= 4) clearInterval(toneTimer);
  };
  ring(); toneTimer = setInterval(ring, 3000);
}
function playAdhan(p){
  $('#abName').textContent = 'صلاة ' + PN[p];
  $('#adhanBox').classList.add('show');
  const file = (p === 'fajr' && sounds.fajr) || sounds.adhan;
  if (file) {
    player = new Audio('/sounds/' + encodeURIComponent(file));
    player.onended = () => setTimeout(stopAdhan, 15000);
    player.play().catch(() => { player = null; tone(); });
  } else tone();
  setTimeout(() => { if (!player) stopAdhan(); }, 3 * 60 * 1000);
}
function checkAdhan(){

  for (const p of FIVE) {
    const key = now.toLocaleDateString('sv') + p;

}

// =================== prayer tree ===================
// one branch per day of the month, five leaves per branch (Fajr nearest the trunk, Isha at the tip)
const TREE_KEY = 'prayerTree.v1';
let treeData = (() => { try { return JSON.parse(localStorage.getItem(TREE_KEY) || '{}'); } catch(e) { return {}; } })();
function saveTree(){ try { localStorage.setItem(TREE_KEY, JSON.stringify(treeData)); } catch(e) {} }
const isoDay = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const monthDays = d => new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
function seeded(seed){ return () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }
const bez = (p0, p1, p2, p3, t) => { const u = 1 - t; return u*u*u*p0 + 3*u*u*t*p1 + 3*u*t*t*p2 + t*t*t*p3; };
const bezD = (p0, p1, p2, p3, t) => { const u = 1 - t; return 3*u*u*(p1 - p0) + 6*u*t*(p2 - p1) + 3*t*t*(p3 - p2); };
const trunkX = y => 500 + 16 * Math.sin((y - 120) / 230);
const trunkHalf = y => 9 + Math.max(0, (y - 200)) / 730 * 40;
const LEAF_D = 'M0,0 C9,-11 31,-13 50,0 C31,13 9,11 0,0 Z';

let treeGeo = null, treeGeoKey = '';
function geometry(month){
  const key = month.getFullYear() + '-' + month.getMonth();
  if (treeGeo && treeGeoKey === key) return treeGeo;
  const r = seeded(month.getFullYear() * 37 + month.getMonth() * 101 + 11), n = monthDays(month), branches = [];
  for (let i = 0; i < n; i++) {
    const t = n > 1 ? i / (n - 1) : 0, side = i % 2 ? 1 : -1;
    const y0 = 800 - Math.pow(t, .85) * 560 + (r() - .5) * 12, x0 = trunkX(y0) + side * trunkHalf(y0) * .5;
    // lower branches long and nearly level, upper ones short and steep: a rounded crown
    const L = (400 - 230 * t) * (.9 + r() * .2), a = (8 + 62 * Math.pow(t, 1.15) + (r() - .5) * 10) * Math.PI / 180;
    const dir = (k, f) => [x0 + side * f * L * Math.cos(a * k), y0 - f * L * Math.sin(a * k)];
    const [x1, y1] = dir(.45, .34), [x2, y2] = dir(.85, .7), [x3, y3] = dir(1.05, 1);
    const wb = 11 - 6 * t, curve = { x: [x0, x1, x2, x3], y: [y0, y1, y2, y3] };
    // tapered outline
    const left = [], right = [];
    for (let k = 0; k <= 18; k++) {
      const s = k / 18, X = bez(...curve.x, s), Y = bez(...curve.y, s), dx = bezD(...curve.x, s), dy = bezD(...curve.y, s);
      const len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len, w = wb * (1 - s) + 1.1 * s;
      left.push([X + nx * w, Y + ny * w]); right.push([X - nx * w, Y - ny * w]);
    }
    const outline = 'M' + left.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' L') + ' L' +
      right.reverse().map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' L') + ' Z';
    // a small twig for realism
    const ts = .55, tx = bez(...curve.x, ts), ty = bez(...curve.y, ts);
    const twig = `M${tx.toFixed(1)},${ty.toFixed(1)} q${(side * 22).toFixed(0)},${(-30 - r() * 12).toFixed(0)} ${(side * 34).toFixed(0)},${(-52 - r() * 10).toFixed(0)}`;
    // five leaves along the outer part of the branch
    const leaves = [.40, .55, .69, .83, .97].map((s, j) => {
      const X = bez(...curve.x, s), Y = bez(...curve.y, s), dx = bezD(...curve.x, s), dy = bezD(...curve.y, s);
      const ang = Math.atan2(dy, dx) * 180 / Math.PI;
      const tilt = j === 4 ? 0 : (j % 2 ? 1 : -1) * (48 + r() * 18);
      return { x: X, y: Y, rot: ang + tilt, sc: .9 + r() * .25,
               gx: 140 + r() * 720, gy: 905 + r() * 60, grot: r() * 360 };
    });
    branches.push({ outline, twig, leaves, tip: [x3, y3] });
  }
  // trunk with roots
  const L = [], R = [];
  for (let y = 200; y <= 930; y += 10) { L.push([trunkX(y) - trunkHalf(y), y]); R.push([trunkX(y) + trunkHalf(y), y]); }
  const trunk = 'M' + L.map(q => q.map(v => v.toFixed(1)).join(',')).join(' L') +
    ' C440,945 395,955 360,962 L640,962 C605,955 560,945 ' + R[R.length - 1].map(v => v.toFixed(1)).join(',') + ' L' +
    R.reverse().map(q => q.map(v => v.toFixed(1)).join(',')).join(' L') + ' Z';
  const bark = Array.from({ length: 9 }, (_, k) => {
    const x = trunkX(600) - 22 + k * 5.5, y0 = 300 + r() * 250;
    return `M${x.toFixed(1)},${y0.toFixed(0)} q${((r() - .5) * 8).toFixed(1)},${(120 + r() * 160).toFixed(0)} ${((r() - .5) * 6).toFixed(1)},${(260 + r() * 200).toFixed(0)}`;
  }).join(' ');
  treeGeo = { branches, trunk, bark }; treeGeoKey = key;
  return treeGeo;
}

function prayerStarted(day, p){
  const now = new Date(), today = isoDay(now);
  if (isoDay(day) < today) return true;
  if (isoDay(day) > today || !pt || !pt.times[p]) return false;
  return at(pt.times[p]) <= now;
}

function renderTree(){
  const now = new Date(), month = new Date(now.getFullYear(), now.getMonth(), 1), geo = geometry(month);
  $('#tbMonth').textContent = now.toLocaleDateString('ar-u-nu-latn', { month:'long', year:'numeric' });
  let leaves = '', fallen = '', buds = '', g = 0, y = 0, f = 0;
  geo.branches.forEach((br, i) => {
    const day = new Date(month.getFullYear(), month.getMonth(), i + 1), rec = treeData[isoDay(day)] || {};
    br.leaves.forEach((lf, j) => {
      const p = FIVE[j], v = rec[p], data = `data-day="${isoDay(day)}" data-p="${p}"`;
      const tf = `translate(${lf.x.toFixed(1)},${lf.y.toFixed(1)}) rotate(${lf.rot.toFixed(0)}) scale(${lf.sc.toFixed(2)})`;
      if (v === 'g' || v === 'y') {
        v === 'g' ? g++ : y++;
        leaves += `<g class="leaf" ${data} transform="${tf}"><path d="${LEAF_D}" fill="url(#${v === 'g' ? 'lfg' : 'lfy'})" stroke="${v === 'g' ? '#1f6b35' : '#9a6d12'}" stroke-width="1"/>`
               + `<path d="M3,0 Q25,-1.5 46,0" stroke="${v === 'g' ? '#bff0c8' : '#fff1bf'}" stroke-opacity=".55" stroke-width="1.4" fill="none"/></g>`;
      } else if (v === 'f') {
        f++;
        fallen += `<g class="leaf" ${data} id="fl-${isoDay(day)}-${p}" transform="translate(${lf.gx.toFixed(0)},${lf.gy.toFixed(0)}) rotate(${lf.grot.toFixed(0)}) scale(.8)">`
               + `<path d="${LEAF_D}" fill="url(#lff)" stroke="#6e4520" stroke-width="1"/></g>`;
      } else if (prayerStarted(day, p)) {
        buds += `<circle class="leaf" ${data} cx="${lf.x.toFixed(1)}" cy="${lf.y.toFixed(1)}" r="7" fill="#e6c55a" fill-opacity=".25" stroke="#e6c55a" stroke-opacity=".7" stroke-width="1.5"/>`;
      } else {
        buds += `<circle cx="${lf.x.toFixed(1)}" cy="${lf.y.toFixed(1)}" r="3.2" fill="#c9e3b0" fill-opacity=".22"/>`;
      }
    });
  });
  const todayIdx = now.getDate() - 1, tb = geo.branches[todayIdx];
  $('#tree').innerHTML = `<defs>
      <linearGradient id="lfg" x1="0" y1="-1" x2="1" y2="1"><stop offset="0" stop-color="#7be08f"/><stop offset=".55" stop-color="#3fae5a"/><stop offset="1" stop-color="#22743a"/></linearGradient>
      <linearGradient id="lfy" x1="0" y1="-1" x2="1" y2="1"><stop offset="0" stop-color="#ffe58a"/><stop offset=".55" stop-color="#f0c24a"/><stop offset="1" stop-color="#c58c14"/></linearGradient>
      <linearGradient id="lff" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c99555"/><stop offset="1" stop-color="#7a4b22"/></linearGradient>
      <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b2413"/><stop offset=".35" stop-color="#6e4526"/><stop offset=".6" stop-color="#7f5530"/><stop offset="1" stop-color="#3a2212"/></linearGradient>
      <linearGradient id="limb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5130"/><stop offset="1" stop-color="#4a2e18"/></linearGradient>
      <radialGradient id="ground" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2f5a2c"/><stop offset="1" stop-color="#2f5a2c" stop-opacity="0"/></radialGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
    </defs>
    <ellipse cx="500" cy="950" rx="430" ry="55" fill="url(#ground)"/>
    <path d="${geo.trunk}" fill="url(#bark)"/>
    <path d="${geo.bark}" stroke="#2a180c" stroke-opacity=".45" stroke-width="2" fill="none"/>
    ${tb ? `<path d="${tb.outline}" fill="#e6c55a" opacity=".55" filter="url(#soft)"/>` : ''}
    ${geo.branches.map(b => `<path d="${b.outline}" fill="url(#limb)"/><path d="${b.twig}" stroke="#5a3a20" stroke-width="2.4" stroke-linecap="round" fill="none"/>`).join('')}
    ${buds}${leaves}${fallen}`;
  const answered = g + y + f;
  $('#sG').textContent = g; $('#sY').textContent = y; $('#sF').textContent = f;
  $('#sP').textContent = answered ? Math.round((g + y * .5) / answered * 100) + '%' : '—';
  renderAsk();
}

function leafFall(dayIso, p){
  const now = new Date(), geo = geometry(new Date(now.getFullYear(), now.getMonth(), 1));
  const br = geo.branches[+dayIso.slice(8) - 1]; if (!br) return;
  const lf = br.leaves[FIVE.indexOf(p)], landed = document.getElementById(`fl-${dayIso}-${p}`);
  if (landed) landed.style.opacity = 0;
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('transform', `translate(${lf.x.toFixed(1)},${lf.y.toFixed(1)})`);
  g.innerHTML = `<g class="falling" style="--dx:${(lf.gx - lf.x).toFixed(0)}px;--dy:${(lf.gy - lf.y).toFixed(0)}px;--rot:${(lf.grot - lf.rot + 360).toFixed(0)}deg">`
    + `<path d="${LEAF_D}" fill="url(#lfy)" transform="rotate(${lf.rot.toFixed(0)}) scale(${lf.sc.toFixed(2)})"/></g>`;
  $('#tree').appendChild(g);
  setTimeout(() => { g.remove(); if (landed) landed.style.opacity = ''; }, 2200);
}

function setTreeAnswer(dayIso, p, v){
  treeData[dayIso] = treeData[dayIso] || {};
  if (v) treeData[dayIso][p] = v; else delete treeData[dayIso][p];
  saveTree(); renderTree();
  if (v === 'f') leafFall(dayIso, p);
}

// ----- the question after each prayer -----
let askQ = null, askSel = 0, snoozeUntil = 0;
function pendingPrayer(){
  const now = new Date();
  if (Date.now() < snoozeUntil) return null;
  for (let d = now.getDate(); d >= 1; d--) {
    const day = new Date(now.getFullYear(), now.getMonth(), d), rec = treeData[isoDay(day)] || {};
    for (const p of [...FIVE].reverse()) {
      if (rec[p] || !prayerStarted(day, p)) continue;
      // today's prayer: ask from 10 minutes after the adhan
      if (d === now.getDate() && (now - at(pt.times[p])) < 10 * 60000) continue;
      return { day, p };
    }
  }
  return null;
}
function renderAsk(){
  const q = $('#adhanBox').classList.contains('show') ? null : pendingPrayer();
  $('#ask').classList.toggle('show', !!q);
  if (!q) { askQ = null; return; }
  const same = askQ && isoDay(askQ.day) === isoDay(q.day) && askQ.p === q.p;
  askQ = q; if (!same) askSel = 0;
  const today = isoDay(q.day) === isoDay(new Date());
  $('#askTitle').textContent = `هل صليت ${PN[q.p]}؟`;
  $('#askSub').textContent = today ? 'اليوم · الأذان ' + pt.times[q.p]
    : q.day.toLocaleDateString('ar-u-nu-latn', { weekday:'long', day:'numeric', month:'long' });
  document.querySelectorAll('#ask button').forEach((b, i) => b.classList.toggle('sel', i === askSel));
}
function answerAsk(v){
  if (!askQ) return;
  if (v === 'later') { snoozeUntil = Date.now() + 20 * 60000; renderAsk(); return; }
  setTreeAnswer(isoDay(askQ.day), askQ.p, v);
}
document.querySelectorAll('#ask button').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); unlockAudio(); answerAsk(b.dataset.v); }));
function askKey(e){
  if (!askQ) return false;
  const btns = document.querySelectorAll('#ask button');
  if (['ArrowDown','ArrowLeft'].includes(e.key) || [40, 37].includes(e.keyCode)) askSel = (askSel + 1) % btns.length;
  else if (['ArrowUp','ArrowRight'].includes(e.key) || [38, 39].includes(e.keyCode)) askSel = (askSel + btns.length - 1) % btns.length;
  else if (e.key === 'Enter' || e.keyCode === 13) { answerAsk(btns[askSel].dataset.v); return true; }
  else return false;
  btns.forEach((b, i) => b.classList.toggle('sel', i === askSel));
  return true;
}
// touch: tap a leaf to change it (empty → green → yellow → fallen → empty)
$('#tree').addEventListener('click', e => {
  const el = e.target.closest('[data-day]'); if (!el) return;
  e.stopPropagation();
  const order = [undefined, 'g', 'y', 'f'], cur = (treeData[el.dataset.day] || {})[el.dataset.p];
  setTreeAnswer(el.dataset.day, el.dataset.p, order[(order.indexOf(cur) + 1) % order.length]);
});
