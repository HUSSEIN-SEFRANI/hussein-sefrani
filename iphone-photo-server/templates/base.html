<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="صوري">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.png') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>{% block title %}صوري{% endblock %}</title>
</head>
<body>
{% block body %}
<header class="top">
  <h1>📷 صوري</h1>
  <div class="stats" id="stats">{{ stats.photos }} صورة · {{ stats.videos }} فيديو · {{ stats.total }}</div>
</header>
<main class="wrap">{% block content %}{% endblock %}</main>
<nav class="tabs">
  <a href="/" class="{{ 'active' if request.path == '/' }}"><span class="i">⬆️</span>رفع</a>
  <a href="/gallery" class="{{ 'active' if request.path == '/gallery' }}"><span class="i">🖼️</span>المعرض</a>
  <a href="/settings" class="{{ 'active' if request.path == '/settings' }}"><span class="i">⚙️</span>الإعدادات</a>
</nav>
{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
