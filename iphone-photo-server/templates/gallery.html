{% extends "base.html" %}
{% block title %}المعرض{% endblock %}
{% block content %}
<div class="filters">
  <button data-kind="all" class="active">الكل</button>
  <button data-kind="photos">صور</button>
  <button data-kind="videos">فيديو</button>
</div>
<div id="gallery"></div>
<div class="empty" id="empty" hidden>لا توجد صور بعد. اذهب إلى «رفع» لإضافة صورك.</div>
<div id="sentinel" style="height:40px"></div>

<div class="viewer" id="viewer">
  <div class="bar">
    <button id="vClose">✕ إغلاق</button>
    <div class="title" id="vTitle"></div>
    <a id="vDownload" href="#">⬇︎ تنزيل</a>
    <button id="vDelete">🗑️</button>
  </div>
  <div class="stage" id="vStage"></div>
  <button class="nav prev" id="vPrev">›</button>
  <button class="nav next" id="vNext">‹</button>
  <div class="meta" id="vMeta"></div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='gallery.js') }}"></script>{% endblock %}
